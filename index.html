<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дорожная карта КВМ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <h1>Мультивселенная Marvel</h1>
        <p>Выбери свою Землю и отмечай просмотренное</p>
    </header>

    <!-- Липкая шапка -->
    <div class="sticky-header">
        <!-- Полоска для мобилок (на ПК скрыта) -->
        <div class="mobile-header-bar">
            <span class="current-universe-label">Настройки вселенной</span>
            <button id="kebab-btn" class="kebab-btn">&#8942;</button>
        </div>
        
        <!-- Контейнер с табами и тумблером (на мобилках это выпадающее меню) -->
        <div id="header-controls" class="header-controls">
            <div class="tabs" id="tabs-container"></div>
            
            <div class="toggle-container">
                <span>Показать необязательные</span>
                <label class="switch">
                    <input type="checkbox" id="optional-toggle">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <!-- Основной лэйаут: сайдбар + таймлайн -->
    <div class="layout-wrapper">
        <nav class="sidebar" id="sidebar">
            <!-- Ссылки на фазы сгенерируются сюда -->
        </nav>

        <main id="movies-container" class="roadmap">
            <!-- Карточки фильмов сгенерируются сюда -->
        </main>
    </div>
<!-- Модальное окно для сюжета -->
    <div id="summary-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" id="close-modal">&times;</span>
            <h2 id="modal-title">Название</h2>
            <div class="modal-body" id="modal-text">Сюжет загружается...</div>
        </div>
    </div>
    <script src="script.js"></script>
    <script src="lore.js"></script>
</body>
</html>
